name: Build mod jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o '*.zip'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
        working-directory: pvp-visuals
      - uses: actions/upload-artifact@v4
        with:
          name: pvp-visuals-jar
          path: |
            pvp-visuals/build/libs/*.jar
            !pvp-visuals/build/libs/*-sources.jar
